<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
 <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#8B6914" stroke-width="2"/>

  <!-- Camera Body -->
  <rect x="20" y="35" width="60" height="40" rx="5" fill="#1a1a1a"/>

  <!-- Camera Lens -->
  <circle cx="50" cy="50" r="18" fill="#2d2d2d" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="50" cy="50" r="12" fill="#0a0a0a"/>
  <circle cx="50" cy="50" r="6" fill="#D4AF37" opacity="0.8"/>

  <!-- Flash -->
<rect x="65" y="28" width="12" height="8" rx="2" fill="#D4AF37"/>
  <rect x="23" y="28" width="8" height="6" rx="1" fill="#D4AF37"/>

  <!-- Text D -->
  <text x="50" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DV</text>
</svg>
